name: Bifrost Diagnostic
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Bifrost
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 90s
          script: |
            echo "=== Bifrost Docker ==="
            docker ps | grep -i bifrost || echo "BIFROST_NOT_RUNNING"

            echo "=== Bifrost health ==="
            curl -fs http://localhost:8080/health || echo "BIFROST_DOWN"

            echo "=== Bifrost providers ==="
            curl -fs http://localhost:8080/api/governance/providers || echo "NO_PROVIDERS_ENDPOINT"

            echo "=== Test LLM call ==="
            VK=$(cat /opt/liveclaw/bots/*/\.picobot/config.json 2>/dev/null | grep apiKey | head -1 | cut -d'"' -f4)
            echo "VK prefix: $(echo $VK | cut -c1-20)"
            curl -fs -X POST http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $VK" \
              --max-time 20 \
              -d '{"model":"minimax/minimax-m2.7","messages":[{"role":"user","content":"hi"}],"max_tokens":3}' || echo "LLM_CALL_FAILED"

            echo "=== Orchestrator .env Bifrost/OpenRouter vars ==="
            grep -iE "BIFROST|OPENROUTER" /opt/liveclaw/backend/.env | sed 's/=.*/=REDACTED/' || echo "NOT_FOUND"

            echo "=== Last 30 orchestrator logs ==="
            pm2 logs liveclaw-orchestrator --lines 30 --nostream 2>/dev/null | tail -35
