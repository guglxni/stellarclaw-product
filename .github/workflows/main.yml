name: LiveClaw CI/CD

on:
  push:
    branches: [main]
    # Skip CI for pure documentation or asset changes
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'SECURITY.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'SECURITY.md'
      - 'LICENSE'
  workflow_dispatch:

# Principle of least privilege — jobs that need extra permissions opt-in below
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  REMOTE_BASE: /opt/liveclaw

# ═══════════════════════════════════════════════════════════════════════════════
# Pipeline: Test → Lint → Security → Deploy
# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Stage 1: Test Suite ─────────────────────────────────────────────────
  test:
    name: '🧪 Test Suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Run full test suite with coverage
        run: npx vitest run --coverage
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 30

  # ─── Stage 2: Lint & Static Analysis ─────────────────────────────────────
  lint:
    name: '🔍 Lint & Validate'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: ESLint
        run: npm run lint
        working-directory: backend

      - name: Syntax validation
        run: |
          node -c server.js
          node -c bifrost.js
          node -c dodo.js
        working-directory: backend

      - name: Check for secrets in code
        run: |
          # Scan for common secret patterns (API keys, tokens, passwords)
          if grep -rn --include="*.js" --include="*.json" --include="*.yml" \
            -E '(sk-[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*['\''"][^'\''"]+['\''"])' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Potential secrets found in source code!"
            exit 1
          fi
          echo "✓ No secrets detected"

  # ─── Stage 3: Security Audit ─────────────────────────────────────────────
  security:
    name: '🛡️ Security Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high || true
        working-directory: backend

      - name: Check for known vulnerabilities
        run: |
          # Check for critical/high vulnerabilities
          RESULT=$(npm audit --omit=dev --json 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$RESULT" | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$RESULT" | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical vulnerabilities found!"
            exit 1
          fi
          echo "✓ No critical vulnerabilities"
        working-directory: backend

  # ─── Stage 4: Deploy (only on main push, after all checks pass) ──────────
  deploy:
    name: '🚀 Deploy to Production'
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DO_DROPLET_IP }}" ] || [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "::error::Missing required secrets: DO_DROPLET_IP and DO_SSH_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::warning::DATABASE_URL secret not set — server will fall back to SQLite"
          fi

      - name: Bootstrap fresh droplet (if needed)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 8m
          script: |
            # Check if PM2 exists (indicates a previously successful deploy)
            if command -v pm2 &>/dev/null && pm2 describe liveclaw-orchestrator &>/dev/null; then
              echo "Droplet already bootstrapped — skipping"
              exit 0
            fi

            set -euo pipefail
            echo "=== Fresh droplet — bootstrapping ==="

            # System deps (idempotent)
            if ! command -v node &>/dev/null; then
              apt-get update -qq
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs nginx docker.io ufw wget rsync
            fi
            command -v pm2 &>/dev/null || npm install -g pm2 --loglevel warn

            # Firewall (idempotent)
            ufw --force enable
            ufw allow ssh
            ufw allow 'Nginx Full'

            # Bifrost AI Gateway Docker (idempotent)
            systemctl enable --now docker
            if ! docker ps --format '{{.Names}}' | grep -q bifrost-gateway; then
              docker rm -f bifrost-gateway 2>/dev/null || true
              docker pull maximhq/bifrost:latest
              docker run -d \
                --name bifrost-gateway \
                --restart unless-stopped \
                -p 127.0.0.1:8080:8080 \
                -v /opt/liveclaw/bifrost-data:/app/data \
                maximhq/bifrost:latest
              echo "  Bifrost gateway started on localhost:8080"
            else
              echo "  Bifrost gateway already running"
            fi

            # Directory structure
            mkdir -p /opt/liveclaw/{backend,frontend,scripts,bots,bifrost-data}

            # Download/update picobot binary (always latest)
            cd /opt/liveclaw/backend
            CURRENT_VER=""
            if [ -f ".picobot-version" ]; then
              CURRENT_VER=$(cat .picobot-version 2>/dev/null || echo "")
            fi
            LATEST_VER=$(curl -sf https://api.github.com/repos/louisho5/picobot/releases/latest | grep -o '"tag_name":\s*"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")

            if [ -n "$LATEST_VER" ] && [ "$CURRENT_VER" != "$LATEST_VER" ]; then
              echo "  Updating picobot: ${CURRENT_VER:-none} → ${LATEST_VER}"
              curl -fSL --retry 3 -o picobot.tmp \
                "https://github.com/louisho5/picobot/releases/download/${LATEST_VER}/picobot_linux_amd64" 2>/dev/null
              if [ -s picobot.tmp ]; then
                mv picobot.tmp picobot
                chmod +x picobot
                echo "$LATEST_VER" > .picobot-version
                echo "  picobot updated to ${LATEST_VER}"
              else
                rm -f picobot.tmp
                echo "  Download failed — keeping existing"
              fi
            elif [ ! -x "/opt/liveclaw/backend/picobot" ] || [ ! -s "/opt/liveclaw/backend/picobot" ]; then
              curl -fSL --retry 3 -o picobot \
                "https://github.com/louisho5/picobot/releases/latest/download/picobot_linux_amd64" 2>/dev/null || touch picobot
              chmod +x picobot
              [ -n "$LATEST_VER" ] && echo "$LATEST_VER" > .picobot-version
              echo "  picobot ready"
            else
              echo "  picobot up-to-date: ${CURRENT_VER}"
            fi

            echo "=== Bootstrap complete! ==="

      - name: Generate frontend config.js from secrets
        run: |
          sed \
            -e "s|{{LIVECLAW_API_BASE}}||g" \
            -e "s|{{LIVECLAW_GOOGLE_CLIENT_ID}}|${{ secrets.GOOGLE_CLIENT_ID }}|g" \
            -e "s|{{LIVECLAW_TURNSTILE_SITE_KEY}}|${{ secrets.LIVECLAW_TURNSTILE_SITE_KEY }}|g" \
            liveclaw-web/config.js.template > liveclaw-web/www/config.js
          echo "Generated config.js (Client ID length: $(grep -o 'GOOGLE_CLIENT_ID.*' liveclaw-web/www/config.js | wc -c) chars)"

      - name: Upload code via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "backend/,scripts/,liveclaw-web/,.env.example"
          target: ${{ env.REMOTE_BASE }}
          overwrite: true
          strip_components: 0

      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail

            echo "=== 1/5 Sync frontend files ==="
            rsync -a --delete /opt/liveclaw/liveclaw-web/www/ /opt/liveclaw/frontend/
            echo "  Frontend synced to /opt/liveclaw/frontend/"

            echo "=== 2/5 Install backend dependencies ==="
            cd /opt/liveclaw/backend
            npm install --omit=dev --loglevel warn

            # Create .env from template if it doesn't exist
            if [ ! -f ".env" ]; then
              cat > .env << 'ENVEOF'
            PORT=3000
            NODE_ENV=production
            DOMAIN_NAME=https://liveclaw.xyz
            ALLOWED_ORIGINS=https://liveclaw.xyz,https://www.liveclaw.xyz
            TOKEN_ENCRYPTION_KEY=CHANGE_ME_64_hex_chars
            ADMIN_SECRET=CHANGE_ME_admin_secret
            MINI_APP_SECRET=CHANGE_ME_64_hex_chars
            BIFROST_GATEWAY_URL=http://localhost:8080
            PICOBOT_PATH=/opt/liveclaw/backend/picobot
            DB_PATH=/opt/liveclaw/backend/liveclaw.db
            BOTS_DIR=/opt/liveclaw/bots
            WATCHDOG_INTERVAL_MS=30000
            MAX_CONCURRENT_BOTS=200
            TURNSTILE_SECRET_KEY=your_turnstile_secret
            DODO_API_KEY=your_dodo_api_key
            DODO_WEBHOOK_SECRET=your_dodo_webhook_secret
            DODO_PRODUCT_ID=your_dodo_product_id
            OPENROUTER_API_KEY=your_openrouter_api_key
            # TELEGRAM_MASTER_BOT_TOKEN=  # optional - for low-credit push notifications
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            MCP_SERVERS_CONFIG=
            ENVEOF
              echo "  ⚠️  Created .env with placeholders — SSH in and edit with real keys!"
            fi

            echo "=== 3/5 Reload orchestrator (zero-downtime) ==="
            if pm2 describe liveclaw-orchestrator &>/dev/null; then
              pm2 reload liveclaw-orchestrator --update-env
            else
              pm2 start server.js --name "liveclaw-orchestrator" --max-memory-restart 512M
            fi
            pm2 save
            pm2 startup 2>/dev/null | tail -n 1 | bash 2>/dev/null || true

            echo "=== 4/5 Nginx ==="
            nginx -t && systemctl reload nginx || echo "Nginx config not ready yet — skipping"

            echo "=== 5/5 Health check ==="
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "⚠ Health check returned HTTP $HTTP_CODE (expected on first deploy if .env has placeholders)"
              pm2 logs liveclaw-orchestrator --lines 10 --nostream || true
            fi

            echo "=== ✅ Deploy complete ==="

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "## 🚀 Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | $([ "$STATUS" = "success" ] && echo '✅ Success' || echo '❌ Failed') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${REF}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | [\`${SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | [View logs](${RUN_URL}) |" >> "$GITHUB_STEP_SUMMARY"
