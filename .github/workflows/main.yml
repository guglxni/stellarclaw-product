name: LiveClaw Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'liveclaw-web/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

env:
  REMOTE_BASE: /opt/liveclaw

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DO_DROPLET_IP }}" ] || [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "::error::Missing required secrets: DO_DROPLET_IP and DO_SSH_KEY"
            exit 1
          fi

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            echo "=== 1/6 Bootstrap (if fresh droplet) ==="
            if [ ! -d "${{ env.REMOTE_BASE }}" ]; then
              echo "  Fresh droplet detected — bootstrapping..."
              
              # System deps
              apt-get update -qq
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs nginx docker.io ufw wget
              npm install -g pm2 --loglevel warn
              
              # Firewall
              ufw --force enable
              ufw allow ssh
              ufw allow 'Nginx Full'
              
              # Bifrost AI Gateway (Docker)
              systemctl enable --now docker
              mkdir -p /opt/liveclaw/bifrost-data
              docker pull maximhq/bifrost:latest
              docker run -d \
                --name bifrost-gateway \
                --restart unless-stopped \
                -p 127.0.0.1:8080:8080 \
                -v /opt/liveclaw/bifrost-data:/app/data \
                maximhq/bifrost:latest
              echo "  Bifrost gateway started on localhost:8080"
              
              # Clone repo
              mkdir -p ${{ env.REMOTE_BASE }}
              cd ${{ env.REMOTE_BASE }}
              git clone https://github.com/guglxni/liveclaw.git .
              
              # Directories
              mkdir -p /opt/liveclaw/{bots,bifrost-data}
              
              # Download picobot binary
              cd /opt/liveclaw/backend
              wget -qO picobot.tar.gz \
                https://github.com/louisho5/picobot/releases/latest/download/picobot-linux-amd64.tar.gz 2>/dev/null || true
              if [ -s picobot.tar.gz ]; then
                tar -xf picobot.tar.gz 2>/dev/null || true
                rm -f picobot.tar.gz
              fi
              [ -f picobot ] || touch picobot
              chmod +x picobot
              echo "  picobot ready"
              
              echo "  Bootstrap complete!"
            fi

            echo "=== 2/6 Pull latest code ==="
            cd ${{ env.REMOTE_BASE }}
            git pull origin main 2>/dev/null || echo "Pull skipped"

            echo "=== 3/6 Install backend dependencies ==="
            cd ${{ env.REMOTE_BASE }}/backend
            npm install --omit=dev --loglevel warn

            echo "=== 4/6 Reload orchestrator (zero-downtime) ==="
            # pm2 reload does graceful restart — existing detached Go processes survive
            if pm2 describe liveclaw-orchestrator &>/dev/null; then
              pm2 reload liveclaw-orchestrator --update-env
            else
              pm2 start server.js --name "liveclaw-orchestrator" --max-memory-restart 256M
            fi
            pm2 save
            pm2 startup 2>/dev/null | tail -n 1 | bash 2>/dev/null || true

            echo "=== 5/6 Setup Nginx (if needed) ==="
            nginx -t && systemctl reload nginx || echo "Nginx config not ready yet — skipping"

            echo "=== 6/6 Health check ==="
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "⚠ Health check returned HTTP $HTTP_CODE (expected on first deploy — .env needs real keys)"
              pm2 logs liveclaw-orchestrator --lines 20 --nostream || true
            fi

            echo "=== ✅ Deploy complete ==="
