name: LiveClaw CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'SECURITY.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'SECURITY.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Skip tests and deploy directly (emergency only)'
        required: false
        default: 'false'
        type: boolean

# Principle of least privilege — jobs that need extra permissions opt-in below
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  REMOTE_BASE: /opt/liveclaw

# ═══════════════════════════════════════════════════════════════════════════════
# Pipeline: Prepare → Test+Lint+Security (parallel) → Deploy Backend → Deploy Frontend
# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ─── Stage 0: Change Detection ──────────────────────────────────────────
  changes:
    name: 'Detect changes'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/**'
              - 'observability/**'
              - 'docker-compose.bifrost.yml'
              - 'docker-compose.observability.yml'
              - '.github/workflows/main.yml'
            frontend:
              - 'liveclaw-web/**'
              - '.github/workflows/main.yml'
            workflows:
              - '.github/**'

  # ─── Stage 1: Test Suite ─────────────────────────────────────────────────
  test:
    name: 'Test Suite'
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend

      - name: Run full test suite with coverage
        run: npm run test:ci
        working-directory: backend

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_id }}
          path: backend/coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f backend/coverage/coverage-summary.json ]; then
            TOTAL=$(jq '.total.lines.pct' backend/coverage/coverage-summary.json 2>/dev/null || echo "N/A")
            echo "### Test Coverage: ${TOTAL}%" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─── Stage 2: Lint & Static Analysis ─────────────────────────────────────
  lint:
    name: 'Lint & Validate'
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: ESLint
        run: npm run lint
        working-directory: backend

      - name: Syntax validation
        run: |
          node -c server.js
          node -c bifrost.js
          node -c dodo.js
          node -c liveclaw-mcp.js
        working-directory: backend

      - name: Detect leaked secrets
        run: |
          # Scan for common secret patterns (API keys, tokens, passwords)
          if grep -rn --include="*.js" --include="*.json" --include="*.yml" \
            -E '(sk-[a-zA-Z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*['\''"][^'\''"]+['\''"])' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Potential secrets found in source code!"
            exit 1
          fi
          echo "✓ No secrets detected"

  # ─── Stage 3: Security Audit ─────────────────────────────────────────────
  security:
    name: 'Security Audit'
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=high || true
        working-directory: backend

      - name: Check for known vulnerabilities
        run: |
          RESULT=$(npm audit --omit=dev --json 2>/dev/null || echo '{}')
          CRITICAL=$(echo "$RESULT" | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(echo "$RESULT" | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical vulnerabilities found!"
            exit 1
          fi
          echo "✓ No critical vulnerabilities"
          echo "### Security: ${CRITICAL} critical, ${HIGH} high" >> "$GITHUB_STEP_SUMMARY"
        working-directory: backend

  # ─── Stage 4a: Deploy Backend ────────────────────────────────────────────
  deploy-backend:
    name: 'Deploy Backend'
    needs: [changes, test, lint, security]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.changes.outputs.backend == 'true') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.DO_DROPLET_IP }}" ] && MISSING="${MISSING} DO_DROPLET_IP"
          [ -z "${{ secrets.DO_SSH_KEY }}" ] && MISSING="${MISSING} DO_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:${MISSING}"
            exit 1
          fi

      - name: Bootstrap fresh droplet (if needed)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 8m
          script: |
            if command -v pm2 &>/dev/null && pm2 describe liveclaw-orchestrator &>/dev/null; then
              echo "Droplet already bootstrapped — skipping"
              exit 0
            fi

            set -euo pipefail
            echo "=== Fresh droplet — bootstrapping ==="

            if ! command -v node &>/dev/null; then
              apt-get update -qq
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y -qq nodejs nginx docker.io ufw wget rsync
            fi
            command -v pm2 &>/dev/null || npm install -g pm2 --loglevel warn

            ufw --force enable
            ufw allow ssh
            ufw allow 'Nginx Full'

            systemctl enable --now docker
            # Install docker compose plugin if missing
            if ! docker compose version &>/dev/null; then
              DOCKER_CONFIG=${DOCKER_CONFIG:-/usr/local/lib/docker}
              mkdir -p "$DOCKER_CONFIG/cli-plugins"
              curl -fSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64" -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
              chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
            fi

            # Migrate standalone Bifrost container to compose stack
            if docker ps -a --format '{{.Names}}' | grep -q '^bifrost-gateway$'; then
              if ! docker inspect bifrost-gateway --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null | grep -q .; then
                echo "  Migrating standalone Bifrost to compose stack..."
                docker stop bifrost-gateway 2>/dev/null || true
                docker rm bifrost-gateway 2>/dev/null || true
              fi
            fi

            mkdir -p /opt/liveclaw/{backend,frontend,scripts,bots,bifrost-data,releases,observability}
            # Bifrost container runs as UID 1000 — ensure data directory is writable
            chown -R 1000:1000 /opt/liveclaw/bifrost-data 2>/dev/null || true

            cd /opt/liveclaw/backend
            CURRENT_VER=""
            [ -f ".picobot-version" ] && CURRENT_VER=$(cat .picobot-version 2>/dev/null || echo "")
            LATEST_VER=$(curl -sf https://api.github.com/repos/louisho5/picobot/releases/latest | grep -o '"tag_name":\s*"[^"]*"' | head -1 | cut -d'"' -f4 || echo "")

            if [ -n "$LATEST_VER" ] && [ "$CURRENT_VER" != "$LATEST_VER" ]; then
              echo "  Updating picobot: ${CURRENT_VER:-none} → ${LATEST_VER}"
              curl -fSL --retry 3 -o picobot.tmp \
                "https://github.com/louisho5/picobot/releases/download/${LATEST_VER}/picobot_linux_amd64" 2>/dev/null
              if [ -s picobot.tmp ]; then
                mv picobot.tmp picobot && chmod +x picobot
                echo "$LATEST_VER" > .picobot-version
              else
                rm -f picobot.tmp
              fi
            elif [ ! -x "/opt/liveclaw/backend/picobot" ] || [ ! -s "/opt/liveclaw/backend/picobot" ]; then
              curl -fSL --retry 3 -o picobot \
                "https://github.com/louisho5/picobot/releases/latest/download/picobot_linux_amd64" 2>/dev/null || touch picobot
              chmod +x picobot
              [ -n "$LATEST_VER" ] && echo "$LATEST_VER" > .picobot-version
            fi

            echo "=== Bootstrap complete! ==="

      - name: Upload backend code + observability stack
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "backend/,scripts/,observability/,docker-compose.bifrost.yml,docker-compose.observability.yml"
          target: ${{ env.REMOTE_BASE }}
          overwrite: true
          strip_components: 0

      - name: Pre-pull Docker images
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            cd /opt/liveclaw
            export BIFROST_DATA_DIR=/opt/liveclaw/bifrost-data

            # Clean up containers from old single-compose layout (one-time migration)
            # The old docker-compose.observability.yml included bifrost, tempo, prometheus
            # as a single project. Tear down any orphaned containers from that layout.
            if docker ps -a --format '{{.Names}}' | grep -q 'bifrost-gateway'; then
              OLD_PROJECT=$(docker inspect bifrost-gateway --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || echo "")
              if [ -n "$OLD_PROJECT" ] && [ "$OLD_PROJECT" != "liveclaw-bifrost" ]; then
                echo "  Cleaning up containers from old compose project: $OLD_PROJECT"
                docker compose -p "$OLD_PROJECT" down --remove-orphans 2>/dev/null || true
              fi
            fi

            echo "=== Pull Bifrost image (critical) ==="
            docker compose -f docker-compose.bifrost.yml pull

            echo "=== Pull observability images (best-effort) ==="
            docker compose -f docker-compose.observability.yml pull 2>&1 || echo "  Some observability images failed to pull (will retry on up)"

      - name: Deploy backend with rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 5m
          script: |
            set -euo pipefail
            RELEASE_DIR="/opt/liveclaw/releases/$(date +%Y%m%d-%H%M%S)-${DEPLOY_SHA:0:7}"

            echo "=== 1/7 Snapshot current release ==="
            if [ -d /opt/liveclaw/backend/node_modules ]; then
              mkdir -p "$RELEASE_DIR"
              cp -r /opt/liveclaw/backend/server.js /opt/liveclaw/backend/dodo.js \
                    /opt/liveclaw/backend/bifrost.js /opt/liveclaw/backend/package.json \
                    /opt/liveclaw/backend/package-lock.json "$RELEASE_DIR/" 2>/dev/null || true
              for mcp in vision-mcp.js telegram-file-mcp.js discord-file-mcp.js slack-file-mcp.js liveclaw-mcp.js sync.js; do
                [ -f "/opt/liveclaw/backend/$mcp" ] && cp "/opt/liveclaw/backend/$mcp" "$RELEASE_DIR/" 2>/dev/null || true
              done
              if [ -d /opt/liveclaw/backend/routes ]; then
                cp -r /opt/liveclaw/backend/routes "$RELEASE_DIR/" 2>/dev/null || true
              fi
              echo "  Snapshot saved to $RELEASE_DIR"
            fi

            echo "=== 2/7 Install dependencies ==="
            cd /opt/liveclaw/backend
            npm install --omit=dev --loglevel warn

            # Create .env from template if missing
            if [ ! -f ".env" ]; then
              cat > .env << 'ENVEOF'
            PORT=3000
            NODE_ENV=production
            DOMAIN_NAME=https://liveclaw.xyz
            ALLOWED_ORIGINS=https://liveclaw.xyz,https://www.liveclaw.xyz
            TOKEN_ENCRYPTION_KEY=CHANGE_ME_64_hex_chars
            ADMIN_SECRET=CHANGE_ME_admin_secret
            BIFROST_GATEWAY_URL=http://localhost:8080
            PICOBOT_PATH=/opt/liveclaw/backend/picobot
            DB_PATH=/opt/liveclaw/backend/liveclaw.db
            BOTS_DIR=/opt/liveclaw/bots
            WATCHDOG_INTERVAL_MS=30000
            MAX_CONCURRENT_BOTS=200
            TURNSTILE_SECRET_KEY=your_turnstile_secret
            DODO_API_KEY=your_dodo_api_key
            DODO_WEBHOOK_SECRET=your_dodo_webhook_secret
            DODO_PRODUCT_ID=your_dodo_product_id
            MCP_SERVERS_CONFIG=
            LIVECLAW_INTERNAL_SECRET=CHANGE_ME_run_openssl_rand_hex_32
            ORCHESTRATOR_URL=http://localhost:3000
            ENVEOF
              echo "  Created .env with placeholders — SSH in and edit!"
            fi

            # ── Migrate existing .env: append any new vars that are missing ──────
            # LIVECLAW_INTERNAL_SECRET — HMAC key for liveclaw-mcp → /internal/recharge
            if ! grep -q '^LIVECLAW_INTERNAL_SECRET=' .env; then
              GENERATED_SECRET=$(openssl rand -hex 32)
              echo "LIVECLAW_INTERNAL_SECRET=${GENERATED_SECRET}" >> .env
              echo "  Auto-generated LIVECLAW_INTERNAL_SECRET (saved to .env)"
            fi
            # ORCHESTRATOR_URL — base URL for internal MCP callbacks (always localhost)
            if ! grep -q '^ORCHESTRATOR_URL=' .env; then
              echo "ORCHESTRATOR_URL=http://localhost:3000" >> .env
              echo "  Added ORCHESTRATOR_URL=http://localhost:3000"
            fi

            echo "=== 3/7 Start Bifrost gateway (critical) ==="
            cd /opt/liveclaw
            export BIFROST_DATA_DIR=/opt/liveclaw/bifrost-data
            # Bifrost runs as UID 1000 — ensure data dir is writable
            chown -R 1000:1000 /opt/liveclaw/bifrost-data 2>/dev/null || true
            # Remove any orphan container from previous compose layout
            docker rm -f bifrost-gateway 2>/dev/null || true
            docker compose -f docker-compose.bifrost.yml up -d --remove-orphans

            # Hard gate: Bifrost must be healthy before proceeding
            echo "  Waiting for Bifrost health..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "  Bifrost healthy (attempt $i)"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "::error::Bifrost failed to start within 60 seconds"
                docker compose -f docker-compose.bifrost.yml logs --tail=30 2>&1 || true
                exit 1
              fi
              sleep 5
            done

            echo "=== 4/7 Start observability stack (best-effort) ==="
            (
              set +e
              export GF_ADMIN_PASSWORD="${GF_ADMIN_PASSWORD:-changeme-generate-a-real-password}"
              docker compose -f docker-compose.observability.yml up -d 2>&1
              echo "  Observability stack launched"
            ) || echo "  Warning: observability stack failed (non-blocking)"

            echo "=== 5/7 Reload orchestrator (zero-downtime) ==="
            if pm2 describe liveclaw-orchestrator &>/dev/null; then
              pm2 reload liveclaw-orchestrator --update-env
            else
              pm2 start server.js --name "liveclaw-orchestrator" --max-memory-restart 512M
            fi
            pm2 save
            pm2 startup 2>/dev/null | tail -n 1 | bash 2>/dev/null || true

            echo "=== 6/7 Nginx ==="
            nginx -t && systemctl reload nginx || echo "Nginx config unchanged"

            echo "=== 7/7 Health check with retry ==="
            HEALTHY=false
            sleep 5  # initial grace period for DB connection + migrations
            for i in 1 2 3 4 5 6 7 8; do
              HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" http://localhost:3000/health || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                HEALTHY=true
                echo "✓ Health check passed on attempt $i (HTTP $HTTP_CODE)"
                break
              fi
              echo "  Attempt $i: HTTP $HTTP_CODE — retrying..."
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "=== PM2 LOGS (last 30 lines) ==="
              pm2 logs liveclaw-orchestrator --nostream --lines 30 2>&1 || true
              echo "=== PM2 STATUS ==="
              pm2 list 2>&1 || true
              echo "::error::Health check failed after 8 attempts!"
              echo "=== ROLLING BACK ==="
              if [ -d "$RELEASE_DIR" ] && [ -f "$RELEASE_DIR/server.js" ]; then
                cp "$RELEASE_DIR"/server.js "$RELEASE_DIR"/dodo.js \
                   "$RELEASE_DIR"/bifrost.js /opt/liveclaw/backend/ 2>/dev/null || true
                # Restore MCP servers if present in snapshot
                for mcp in vision-mcp.js telegram-file-mcp.js discord-file-mcp.js slack-file-mcp.js liveclaw-mcp.js sync.js; do
                  [ -f "$RELEASE_DIR/$mcp" ] && cp "$RELEASE_DIR/$mcp" /opt/liveclaw/backend/ 2>/dev/null || true
                done
                # Restore route modules if present in snapshot
                if [ -d "$RELEASE_DIR/routes" ]; then
                  cp -r "$RELEASE_DIR/routes" /opt/liveclaw/backend/ 2>/dev/null || true
                fi
                pm2 reload liveclaw-orchestrator --update-env
                sleep 5
                ROLLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
                echo "  Rollback health: HTTP $ROLLBACK_CODE"
              fi
              exit 1
            fi

            # Prune old releases (keep last 5)
            cd /opt/liveclaw/releases
            ls -dt */ 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true

            echo "=== Deploy complete (${DEPLOY_SHA:0:7}) ==="

      - name: Backend deploy summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "### Backend Deploy: $([ "$STATUS" = "success" ] && echo '✅' || echo '❌') $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`api.liveclaw.xyz\` |" >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 4b: Deploy Frontend ──────────────────────────────────────────
  deploy-frontend:
    name: 'Deploy Frontend'
    needs: [changes, test, lint, security]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      (needs.changes.outputs.frontend == 'true') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate frontend config.js from secrets
        run: |
          sed \
            -e "s|{{LIVECLAW_API_BASE}}||g" \
            -e "s|{{LIVECLAW_GOOGLE_CLIENT_ID}}|${{ secrets.GOOGLE_CLIENT_ID }}|g" \
            -e "s|{{LIVECLAW_TURNSTILE_SITE_KEY}}|${{ secrets.LIVECLAW_TURNSTILE_SITE_KEY }}|g" \
            -e "s|{{LIVECLAW_POSTHOG_KEY}}|${{ secrets.LIVECLAW_POSTHOG_KEY }}|g" \
            -e "s|{{LIVECLAW_POSTHOG_HOST}}|${{ secrets.LIVECLAW_POSTHOG_HOST }}|g" \
            -e "s|{{LIVECLAW_GTM_ID}}|${{ secrets.LIVECLAW_GTM_ID }}|g" \
            -e "s|{{LIVECLAW_APPLIXIR_ZONE_ID}}|${{ secrets.LIVECLAW_APPLIXIR_ZONE_ID }}|g" \
            liveclaw-web/config.js.template > liveclaw-web/www/config.js

          # Safety net: replace any remaining unreplaced template vars with empty strings
          sed -i "s|'{{[A-Z_]*}}'|''|g" liveclaw-web/www/config.js

          # Verify no template vars remain
          if grep -q '{{' liveclaw-web/www/config.js; then
            echo "::error::config.js still contains unreplaced template variables"
            grep '{{' liveclaw-web/www/config.js
            exit 1
          fi

      - name: Upload frontend
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DO_FRONTEND_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "liveclaw-web/www/"
          target: /opt/liveclaw
          overwrite: true
          strip_components: 0

      - name: Sync frontend files
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DO_FRONTEND_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            rsync -a --delete /opt/liveclaw/liveclaw-web/www/ /opt/liveclaw/frontend/
            nginx -t && systemctl reload nginx || echo "Nginx unchanged"

            # Verify frontend is serving
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
            echo "Frontend health: HTTP $HTTP_CODE"

      - name: Frontend deploy summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "### Frontend Deploy: $([ "$STATUS" = "success" ] && echo '✅' || echo '❌') $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`liveclaw.xyz\` |" >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 5: Post-Deploy Verification ──────────────────────────────────
  verify:
    name: 'Smoke Test'
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install jq
        run: which jq || (apt-get update -qq && apt-get install -y -qq jq)

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          # Run and capture output — always write to summary regardless of exit code
          set +e
          OUTPUT=$(bash scripts/smoke-test.sh 2>&1)
          EXIT_CODE=$?
          set -e

          echo "### Production Smoke Tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::Smoke tests failed — check deployment"
          fi
          exit $EXIT_CODE
