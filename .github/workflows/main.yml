name: LiveClaw Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'liveclaw-web/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

env:
  REMOTE_BASE: /opt/liveclaw

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.DO_DROPLET_IP }}" ] || [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "::error::Missing required secrets: DO_DROPLET_IP and DO_SSH_KEY"
            exit 1
          fi

      - name: Bootstrap fresh droplet (if needed)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 8m
          script: |
            if [ -d "/opt/liveclaw/backend" ]; then
              echo "Droplet already bootstrapped — skipping"
              exit 0
            fi

            set -euo pipefail
            echo "=== Fresh droplet detected — bootstrapping ==="

            # System deps
            apt-get update -qq
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y -qq nodejs nginx docker.io ufw wget rsync
            npm install -g pm2 --loglevel warn

            # Firewall
            ufw --force enable
            ufw allow ssh
            ufw allow 'Nginx Full'

            # Bifrost AI Gateway (Docker)
            systemctl enable --now docker
            mkdir -p /opt/liveclaw/bifrost-data
            docker pull maximhq/bifrost:latest
            docker run -d \
              --name bifrost-gateway \
              --restart unless-stopped \
              -p 127.0.0.1:8080:8080 \
              -v /opt/liveclaw/bifrost-data:/app/data \
              maximhq/bifrost:latest
            echo "  Bifrost gateway started on localhost:8080"

            # Create directory structure
            mkdir -p /opt/liveclaw/{backend,frontend,scripts,bots,bifrost-data}

            # Download picobot binary
            cd /opt/liveclaw/backend
            wget -qO picobot.tar.gz \
              https://github.com/louisho5/picobot/releases/latest/download/picobot-linux-amd64.tar.gz 2>/dev/null || true
            if [ -s picobot.tar.gz ]; then
              tar -xf picobot.tar.gz 2>/dev/null || true
              rm -f picobot.tar.gz
            fi
            [ -f picobot ] || touch picobot
            chmod +x picobot
            echo "  picobot ready"

            echo "=== Bootstrap complete! ==="

      - name: Upload code via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          source: "backend/,scripts/,liveclaw-web/,.env.example"
          target: ${{ env.REMOTE_BASE }}
          overwrite: true
          strip_components: 0

      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail

            echo "=== 1/4 Install backend dependencies ==="
            cd /opt/liveclaw/backend
            npm install --omit=dev --loglevel warn

            # Create .env from template if it doesn't exist
            if [ ! -f ".env" ]; then
              cat > .env << 'ENVEOF'
            PORT=3000
            NODE_ENV=production
            ALLOWED_ORIGINS=https://liveclaw.xyz,https://www.liveclaw.xyz
            BIFROST_GATEWAY_URL=http://localhost:8080
            MINIMAX_API_KEY=your_minimax_key
            PICOBOT_PATH=/opt/liveclaw/backend/picobot
            DB_PATH=/opt/liveclaw/backend/liveclaw.db
            BOTS_DIR=/opt/liveclaw/bots
            TURNSTILE_SECRET_KEY=your_turnstile_secret
            APPLIXIR_SECRET_KEY=your_applixir_secret
            TELEGRAM_MASTER_BOT_TOKEN=your_telegram_bot_token
            ENVEOF
              echo "  ⚠️  Created .env with placeholders — SSH in and edit with real keys!"
            fi

            echo "=== 2/4 Reload orchestrator (zero-downtime) ==="
            if pm2 describe liveclaw-orchestrator &>/dev/null; then
              pm2 reload liveclaw-orchestrator --update-env
            else
              pm2 start server.js --name "liveclaw-orchestrator" --max-memory-restart 256M
            fi
            pm2 save
            pm2 startup 2>/dev/null | tail -n 1 | bash 2>/dev/null || true

            echo "=== 3/4 Nginx ==="
            nginx -t && systemctl reload nginx || echo "Nginx config not ready yet — skipping"

            echo "=== 4/4 Health check ==="
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed (HTTP $HTTP_CODE)"
            else
              echo "⚠ Health check returned HTTP $HTTP_CODE (expected on first deploy if .env has placeholders)"
              pm2 logs liveclaw-orchestrator --lines 10 --nostream || true
            fi

            echo "=== ✅ Deploy complete ==="
