name: Fix OpenRouter Key in Bifrost
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update OpenRouter key and verify
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 120s
          script: |
            MGMTKEY=$(grep '^OPENROUTER_MGMT_KEY=' /opt/liveclaw/backend/.env | cut -d= -f2- | tr -d '"' | tr -d "'")
            echo "MGMT key suffix: ...${MGMTKEY: -4}"

            echo ""
            echo "=== Test MGMT key directly on OpenRouter chat completions ==="
            curl -sS -w "\n---HTTP:%{http_code}" \
              -X POST https://openrouter.ai/api/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${MGMTKEY}" \
              --max-time 30 \
              -d '{"model":"minimax/minimax-m2.7","messages":[{"role":"user","content":"hi"}],"max_tokens":3}'

            echo ""
            echo "=== Restart Bifrost to flush in-memory key cache ==="
            cd /opt/liveclaw && docker compose -f docker-compose.bifrost.yml restart bifrost
            echo "Waiting 15s for Bifrost to be healthy..."
            sleep 15
            curl -sS http://localhost:8080/health

            echo ""
            echo "=== Test LLM call through Bifrost after restart ==="
            VK=$(cat /opt/liveclaw/bots/*/.picobot/config.json 2>/dev/null | grep apiKey | head -1 | cut -d'"' -f4)
            curl -sS -X POST http://localhost:8080/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${VK}" \
              --max-time 30 \
              -d '{"model":"minimax/minimax-m2.7","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'
