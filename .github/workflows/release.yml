name: Release

# Automated semantic versioning from conventional commits.
# Creates GitHub Releases with auto-generated changelogs.
# Triggered only on main branch pushes (after CI/CD completes).

on:
  workflow_run:
    workflows: ['LiveClaw CI/CD']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 'Tag & Release'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"

      - name: Determine version bump
        id: bump
        run: |
          LATEST="${{ steps.latest_tag.outputs.tag }}"
          CURRENT=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Analyze commits since last tag
          COMMITS=$(git log "${LATEST}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="none"
          if echo "$COMMITS" | grep -qiE '^(feat|feature)!:|BREAKING CHANGE'; then
            BUMP="major"
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qiE '^feat(\(.*\))?:'; then
            BUMP="minor"
            MINOR=$((MINOR + 1)); PATCH=0
          elif echo "$COMMITS" | grep -qiE '^(fix|perf|refactor|ci|build)(\(.*\))?:'; then
            BUMP="patch"
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP → $NEW_VERSION"

      - name: Generate changelog
        if: steps.bump.outputs.bump != 'none'
        id: changelog
        run: |
          LATEST="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${{ steps.bump.outputs.version }}"

          {
            echo "## ${VERSION}"
            echo ""
            echo "**Released:** $(date -u +%Y-%m-%d)"
            echo ""

            # Features
            FEATS=$(git log "${LATEST}..HEAD" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "### Features"
              echo "$FEATS"
              echo ""
            fi

            # Fixes
            FIXES=$(git log "${LATEST}..HEAD" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            # CI/Infra
            CI=$(git log "${LATEST}..HEAD" --pretty=format:"- %s (%h)" --grep="^ci\|^build\|^infra" 2>/dev/null || true)
            if [ -n "$CI" ]; then
              echo "### CI & Infrastructure"
              echo "$CI"
              echo ""
            fi

            # Other
            OTHER=$(git log "${LATEST}..HEAD" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat\|^fix\|^ci\|^build\|^infra\|^docs\|^chore" 2>/dev/null || true)
            if [ -n "$OTHER" ]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "---"
            echo "**Full Changelog:** [\`${LATEST}...${VERSION}\`](https://github.com/${{ github.repository }}/compare/${LATEST}...${VERSION})"
          } > /tmp/changelog.md

          cat /tmp/changelog.md

      - name: Create release
        if: steps.bump.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"

          # Tag
          git tag "$VERSION"
          git push origin "$VERSION"

          # Release
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file /tmp/changelog.md \
            --latest

          echo "### Release ${VERSION} created" >> "$GITHUB_STEP_SUMMARY"

      - name: No release needed
        if: steps.bump.outputs.bump == 'none'
        run: echo "No conventional commits found since ${{ steps.latest_tag.outputs.tag }} — skipping release"
