name: Server Diagnostic
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run diagnostics
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60s
          script: |
            echo "=== 1. Picobot binary ==="
            ls -la /opt/liveclaw/backend/picobot
            cat /opt/liveclaw/backend/.picobot-version 2>/dev/null || echo "no version file"
            sha256sum /opt/liveclaw/backend/picobot

            echo ""
            echo "=== 2. Running picobot processes ==="
            ps aux | grep picobot | grep -v grep || echo "no picobot processes"

            echo ""
            echo "=== 3. PM2 status ==="
            pm2 status

            echo ""
            echo "=== 4. Check if patched (look for Photo in binary) ==="
            strings /opt/liveclaw/backend/picobot | grep -c "Photo received" || echo "0 matches"
            strings /opt/liveclaw/backend/picobot | grep -c "PICOBOT_SHOW_TOOL_ACTIVITY" || echo "0 matches"

            echo ""
            echo "=== 5. Bot config check ==="
            # Find a bot's config.json and check enableToolActivityIndicator
            FIRST_BOT=$(ls -d /opt/liveclaw/bots/*/  2>/dev/null | head -1)
            if [ -n "$FIRST_BOT" ]; then
              echo "Bot dir: $FIRST_BOT"
              cat "${FIRST_BOT}.picobot/config.json" 2>/dev/null | python3 -m json.tool 2>/dev/null | head -30 || echo "no config.json"
              echo ""
              echo "--- SOUL.md first 5 lines ---"
              head -5 "${FIRST_BOT}.picobot/workspace/SOUL.md" 2>/dev/null || echo "no SOUL.md"
              echo ""
              echo "--- profile.md ---"
              cat "${FIRST_BOT}.picobot/workspace/profile.md" 2>/dev/null || echo "no profile.md"
              echo ""
              echo "--- workspace files ---"
              ls -la "${FIRST_BOT}.picobot/workspace/" 2>/dev/null | head -15
            else
              echo "no bot directories found"
            fi

            echo ""
            echo "=== 6. Picobot process environment ==="
            PICO_PID=$(pgrep -f "picobot gateway" | head -1)
            if [ -n "$PICO_PID" ]; then
              echo "PID: $PICO_PID"
              cat /proc/$PICO_PID/environ 2>/dev/null | tr '\0' '\n' | grep -E "PICOBOT_SHOW|OPENROUTER|VISION|OCR|BIFROST|LIVECLAW" || echo "env not readable"
            else
              echo "no picobot process found"
            fi

            echo ""
            echo "=== 7. Recent orchestrator logs ==="
            pm2 logs liveclaw-orchestrator --lines 50 --nostream 2>/dev/null || echo "no logs"

            echo ""
            echo "=== 8. Bifrost health ==="
            curl -sf http://localhost:8080/health 2>&1 || echo "BIFROST DOWN or no /health endpoint"
            echo ""
            echo "--- Bifrost version ---"
            curl -sf http://localhost:8080/v1/models 2>&1 | head -200 || echo "no /v1/models"

            echo ""
            echo "=== 9. Bifrost VK status ==="
            VK_ID=$(cat /opt/liveclaw/bots/*/\\.picobot/config.json 2>/dev/null | python3 -c "
import sys, json
for line in sys.stdin:
    pass
" 2>/dev/null || true)
            # Read VK key from first bot config
            VK_KEY=$(python3 -c "
import json, glob
configs = glob.glob('/opt/liveclaw/bots/*/.picobot/config.json')
if configs:
    data = json.load(open(configs[0]))
    print(data.get('providers',{}).get('openai',{}).get('apiKey','NOT_FOUND'))
" 2>/dev/null || echo "NOT_FOUND")
            echo "VK key prefix: ${VK_KEY:0:20}..."
            echo ""
            echo "--- VK API call to Bifrost ---"
            curl -sf -H "Authorization: Bearer $VK_KEY" \
              http://localhost:8080/api/governance/virtual-keys 2>&1 | python3 -m json.tool 2>/dev/null | head -30 || echo "VK API call failed"

            echo ""
            echo "=== 10. Test LLM call through Bifrost ==="
            VK_KEY=$(python3 -c "
import json, glob
configs = glob.glob('/opt/liveclaw/bots/*/.picobot/config.json')
if configs:
    data = json.load(open(configs[0]))
    print(data.get('providers',{}).get('openai',{}).get('apiKey',''))
" 2>/dev/null || echo "")
            if [ -n "$VK_KEY" ]; then
              curl -sf -X POST http://localhost:8080/v1/chat/completions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $VK_KEY" \
                -d '{"model":"minimax/minimax-m2.7","messages":[{"role":"user","content":"hi"}],"max_tokens":5}' \
                2>&1 | head -200 || echo "LLM call failed (curl error)"
            else
              echo "Could not read VK key"
            fi

            echo ""
            echo "=== 11. Bifrost Docker container ==="
            docker ps 2>/dev/null | grep -i bifrost || echo "no bifrost docker container (or docker not available)"
            docker logs bifrost --tail 20 2>/dev/null || echo "no bifrost docker logs"
