name: Picobot Auto-Update

# ═══════════════════════════════════════════════════════════════════════════
# Automatically checks for new picobot releases from louisho5/picobot
# and deploys the updated binary to production.
#
# NOTE: For MCP support (louisho5/picobot#9), use picobot-mcp-build.yml
# instead. Once PR #9 is merged into main, this workflow will automatically
# pick up MCP support from official releases.
#
# Triggers:
#   1. Scheduled: Every 6 hours (catches releases quickly)
#   2. Manual: workflow_dispatch for on-demand updates
#   3. repository_dispatch: Can be called by a GitHub webhook from picobot repo
#
# The workflow:
#   - Checks GitHub API for latest picobot release
#   - Compares against version deployed on production server
#   - Downloads new binary, verifies SHA256, deploys
#   - Gracefully reloads the orchestrator via PM2
#   - Posts notification to the event log
# ═══════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download even if version matches'
        required: false
        default: 'false'
        type: boolean
      variant:
        description: 'Picobot build variant'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - lite

  # Allow external triggers (e.g., picobot repo webhook)
  repository_dispatch:
    types: [picobot-release]

concurrency:
  group: picobot-update
  cancel-in-progress: true

env:
  PICOBOT_REPO: louisho5/picobot
  REMOTE_BASE: /opt/liveclaw

jobs:
  check-and-update:
    name: '🤖 Picobot Update'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      updated: ${{ steps.check.outputs.updated }}
      old_version: ${{ steps.check.outputs.old_version }}
      new_version: ${{ steps.check.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest picobot release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching latest release from ${PICOBOT_REPO}..."
          RELEASE=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${PICOBOT_REPO}/releases/latest")

          LATEST_TAG=$(echo "$RELEASE" | jq -r '.tag_name')
          PUBLISHED=$(echo "$RELEASE" | jq -r '.published_at')
          echo "Latest: ${LATEST_TAG} (published: ${PUBLISHED})"

          # Get asset URL for linux/amd64
          VARIANT="${{ inputs.variant || 'full' }}"
          if [ "$VARIANT" = "lite" ]; then
            ASSET_NAME="picobot_linux_amd64_lite"
          else
            ASSET_NAME="picobot_linux_amd64"
          fi

          DOWNLOAD_URL=$(echo "$RELEASE" | jq -r --arg name "$ASSET_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url')
          ASSET_SHA=$(echo "$RELEASE" | jq -r --arg name "$ASSET_NAME" \
            '.assets[] | select(.name == $name) | .digest' | sed 's/sha256://')
          ASSET_SIZE=$(echo "$RELEASE" | jq -r --arg name "$ASSET_NAME" \
            '.assets[] | select(.name == $name) | .size')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::Asset '${ASSET_NAME}' not found in release ${LATEST_TAG}"
            # Try legacy .tar.gz format
            ASSET_NAME="picobot-linux-amd64.tar.gz"
            DOWNLOAD_URL=$(echo "$RELEASE" | jq -r --arg name "$ASSET_NAME" \
              '.assets[] | select(.name == $name) | .browser_download_url')
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
              echo "::error::No compatible asset found"
              exit 1
            fi
          fi

          echo "Asset: ${ASSET_NAME}"
          echo "URL: ${DOWNLOAD_URL}"
          echo "SHA256: ${ASSET_SHA:-unknown}"
          echo "Size: ${ASSET_SIZE:-unknown} bytes"

          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_sha=${ASSET_SHA}" >> "$GITHUB_OUTPUT"
          echo "asset_size=${ASSET_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Check deployed version on server
        id: deployed
        if: ${{ secrets.DO_DROPLET_IP != '' && secrets.DO_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30s
          script: |
            VERSION_FILE="/opt/liveclaw/backend/.picobot-version"
            if [ -f "$VERSION_FILE" ]; then
              cat "$VERSION_FILE"
            elif [ -x "/opt/liveclaw/backend/picobot" ]; then
              /opt/liveclaw/backend/picobot version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "unknown"
            else
              echo "not-installed"
            fi

      - name: Determine if update needed
        id: decide
        run: |
          LATEST="${{ steps.check.outputs.latest_tag }}"
          # appleboy/ssh-action outputs go to stdout, capture from step
          DEPLOYED="${{ steps.deployed.outputs.stdout || 'not-installed' }}"
          DEPLOYED=$(echo "$DEPLOYED" | tr -d '[:space:]')  # trim whitespace
          FORCE="${{ inputs.force || 'false' }}"

          echo "Deployed: '${DEPLOYED}'"
          echo "Latest:   '${LATEST}'"
          echo "Force:    '${FORCE}'"

          echo "old_version=${DEPLOYED}" >> "$GITHUB_OUTPUT"
          echo "new_version=${LATEST}" >> "$GITHUB_OUTPUT"

          if [ "$DEPLOYED" = "$LATEST" ] && [ "$FORCE" != "true" ]; then
            echo "Already up-to-date — skipping deploy"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed: ${DEPLOYED} → ${LATEST}"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated picobot binary
        if: steps.decide.outputs.updated == 'true' && secrets.DO_DROPLET_IP != '' && secrets.DO_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail

            PICOBOT_DIR="/opt/liveclaw/backend"
            BINARY_PATH="${PICOBOT_DIR}/picobot"
            VERSION_FILE="${PICOBOT_DIR}/.picobot-version"
            DOWNLOAD_URL="${{ steps.check.outputs.download_url }}"
            LATEST_TAG="${{ steps.check.outputs.latest_tag }}"
            ASSET_NAME="${{ steps.check.outputs.asset_name }}"
            EXPECTED_SHA="${{ steps.check.outputs.asset_sha }}"
            TMP_FILE="${PICOBOT_DIR}/picobot.download.tmp"

            echo "=== Downloading picobot ${LATEST_TAG} ==="
            mkdir -p "$PICOBOT_DIR"

            # Download with retry
            curl -fSL --retry 3 --retry-delay 5 \
              --connect-timeout 15 --max-time 120 \
              -o "$TMP_FILE" "$DOWNLOAD_URL"

            # Verify SHA256 if available
            if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "null" ]; then
              ACTUAL_SHA=$(sha256sum "$TMP_FILE" | awk '{print $1}')
              if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::SHA256 mismatch! Expected: ${EXPECTED_SHA}, Got: ${ACTUAL_SHA}"
                rm -f "$TMP_FILE"
                exit 1
              fi
              echo "✓ SHA256 verified: ${ACTUAL_SHA}"
            fi

            # Handle tar.gz vs raw binary
            if [[ "$ASSET_NAME" == *.tar.gz ]]; then
              echo "Extracting archive..."
              tar -xf "$TMP_FILE" -C "$PICOBOT_DIR"
              rm -f "$TMP_FILE"
            else
              # Backup old binary
              if [ -f "$BINARY_PATH" ]; then
                cp "$BINARY_PATH" "${BINARY_PATH}.bak"
              fi
              mv "$TMP_FILE" "$BINARY_PATH"
            fi

            chmod +x "$BINARY_PATH"

            # Verify binary works
            if ! "$BINARY_PATH" version &>/dev/null; then
              echo "::error::Binary verification failed!"
              # Rollback
              if [ -f "${BINARY_PATH}.bak" ]; then
                mv "${BINARY_PATH}.bak" "$BINARY_PATH"
                echo "Rolled back to previous version"
              fi
              exit 1
            fi

            # Record version
            echo "$LATEST_TAG" > "$VERSION_FILE"
            SIZE=$(ls -lh "$BINARY_PATH" | awk '{print $5}')
            echo "✓ picobot updated to ${LATEST_TAG} (${SIZE})"

            # Clean up backup
            rm -f "${BINARY_PATH}.bak"

            # Reload orchestrator (doesn't restart running picobot agents)
            echo "=== Reloading orchestrator ==="
            if pm2 describe liveclaw-orchestrator &>/dev/null; then
              pm2 reload liveclaw-orchestrator --update-env
              echo "✓ PM2 reloaded"
            else
              echo "⚠ Orchestrator not running via PM2"
            fi

            echo "=== ✅ Picobot update complete: ${LATEST_TAG} ==="

      - name: Summary
        if: always()
        run: |
          UPDATED="${{ steps.decide.outputs.updated || 'skipped' }}"
          OLD="${{ steps.decide.outputs.old_version || 'unknown' }}"
          NEW="${{ steps.decide.outputs.new_version || 'unknown' }}"

          echo "## 🤖 Picobot Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$UPDATED" = "true" ]; then
            echo "✅ **Updated:** \`${OLD}\` → \`${NEW}\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPDATED" = "false" ]; then
            echo "ℹ️ **Already up-to-date:** \`${NEW}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ **Skipped** (missing deployment secrets or error)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repo | [${PICOBOT_REPO}](https://github.com/${PICOBOT_REPO}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Latest | \`${NEW}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployed | \`${OLD}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
