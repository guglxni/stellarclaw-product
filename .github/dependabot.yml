version: 2
updates:
  # npm – backend
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "deps"
    groups:
      # Batch minor/patch bumps so the PR list stays manageable
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-all:
        dependency-type: development

  # GitHub Actions – keep all action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
      - automated
    commit-message:
      prefix: "ci"
