# ═══════════════════════════════════════════════════════════════════════════
# Grafana Tempo — Distributed Trace Backend for LiveClaw
#
# Receives OTLP traces from OTel Collector, stores locally.
# Queried by Grafana for trace visualization.
# ═══════════════════════════════════════════════════════════════════════════

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05

compactor:
  compaction:
    block_retention: 336h  # 14 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
      service: liveclaw
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions:
        - gen_ai.request.model
        - gen_ai.provider.name
    span_metrics:
      dimensions:
        - gen_ai.request.model
        - gen_ai.provider.name

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
