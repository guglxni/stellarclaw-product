# ─────────────────────────────────────────────────────────────────────────────
# Alertmanager Configuration — LiveClaw Production
#
# IMPORTANT: GMAIL_APP_PASSWORD_PLACEHOLDER is replaced at deploy time
# by the deploy script using the GMAIL_APP_PASSWORD value from .env.
# Never commit real credentials here.
#
# Gmail setup (one-time):
#   1. Go to https://myaccount.google.com/apppasswords
#   2. Select "Mail" + "Other (LiveClaw)"
#   3. Copy the 16-character app password
#   4. SSH into the backend server and run:
#        echo "GMAIL_APP_PASSWORD=<your-app-password>" >> /opt/liveclaw/backend/.env
#   5. Re-deploy: git commit --allow-empty -m "chore: redeploy" && git push
# ─────────────────────────────────────────────────────────────────────────────

global:
  # Gmail SMTP — requires a Google App Password (not your account password)
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "guglaniaaryan@gmail.com"
  smtp_auth_username: "guglaniaaryan@gmail.com"
  smtp_auth_password: "GMAIL_APP_PASSWORD_PLACEHOLDER"
  smtp_require_tls: true
  resolve_timeout: 5m

# ── Routing tree ──────────────────────────────────────────────────────────────
route:
  receiver: email-oncall
  group_by: ["alertname", "instance"]
  group_wait: 30s          # wait 30s to batch alerts from the same group
  group_interval: 5m       # wait 5m before re-notifying on the same group
  repeat_interval: 4h      # re-notify every 4h if still firing (not spam)

  routes:
    # Critical alerts — shorter repeat interval
    - match:
        severity: critical
      receiver: email-oncall
      repeat_interval: 1h

    # Warning alerts — normal repeat
    - match:
        severity: warning
      receiver: email-oncall
      repeat_interval: 6h

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: email-oncall
    email_configs:
      - to: "guglaniaaryan@gmail.com"
        send_resolved: true    # also email when alert clears
        headers:
          Subject: >-
            [LiveClaw {{ .Status | toUpper }}]
            {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
        html: |
          <h2>LiveClaw Alert — {{ .Status | toUpper }}</h2>
          {{ range .Alerts }}
          <p>
            <strong>{{ .Annotations.summary }}</strong><br/>
            {{ .Annotations.description }}<br/>
            <em>Started: {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}</em>
            {{ if .EndsAt.IsZero }}{{ else }}
            <em>Resolved: {{ .EndsAt.Format "2006-01-02 15:04:05 UTC" }}</em>
            {{ end }}
          </p>
          {{ end }}
          <hr/>
          <small>LiveClaw Alertmanager &mdash; <a href="http://localhost:9093">Alertmanager UI</a></small>

# ── Inhibition rules ──────────────────────────────────────────────────────────
# If an endpoint is completely down, suppress the "slow response" warning for it.
inhibit_rules:
  - source_match:
      severity: critical
      alertname: EndpointDown
    target_match:
      severity: warning
      alertname: SlowResponseTime
    equal: ["instance"]
