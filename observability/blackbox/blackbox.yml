# ─────────────────────────────────────────────────────────────────────────────
# Blackbox Exporter — HTTP Probe Modules
# Prometheus scrapes these via /probe?target=<url>&module=<name>
# ─────────────────────────────────────────────────────────────────────────────
modules:

  # General HTTPS pages — accepts 200/301/302, follows redirects
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 301, 302]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      tls_config:
        insecure_skip_verify: false

  # API health endpoint — must return 200 AND body must contain {"status":"ok"}
  http_api_health:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"ok"'
      tls_config:
        insecure_skip_verify: false
