# ═══════════════════════════════════════════════════════════════════════════
# Prometheus — LiveClaw Metrics Collection
#
# Scrapes:
#   1. Bifrost /metrics          — LLM request metrics (tokens, cost, latency)
#   2. OTel Collector /metrics   — Collector-derived metrics from OTLP pipeline
#   3. OTel Collector internal   — Collector health metrics
#   4. Blackbox Exporter         — External HTTP endpoint probes (uptime)
#
# Alerts routed to Alertmanager → email via Gmail SMTP
# ═══════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ── Alert rule files ──────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ── Alertmanager integration ──────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

scrape_configs:
  # Bifrost native Prometheus metrics
  # Exposes: request counts, token usage, cost, latency histograms,
  #          cache hits, stream TTFT, inter-token latency
  - job_name: "bifrost"
    static_configs:
      - targets: ["bifrost:8080"]
        labels:
          service: "liveclaw-bifrost"
          component: "ai-gateway"
    metrics_path: /metrics
    scrape_interval: 10s

  # OTel Collector — OTLP-derived metrics (from Bifrost traces)
  - job_name: "otel-collector-bifrost"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "liveclaw-otel"
          component: "collector-pipeline"

  # OTel Collector internal health metrics
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: "collector-health"

  # ── Blackbox Exporter — external endpoint probes (uptime) ─────────────────
  # Each target is probed from inside Docker → internet → back.
  # probe_success=1 = reachable + expected HTTP status + body check (for API).

  - job_name: "blackbox-frontend"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "https://liveclaw.xyz"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"
    scrape_interval: 30s

  - job_name: "blackbox-api"
    metrics_path: /probe
    params:
      module: [http_api_health]
    static_configs:
      - targets:
          - "https://api.liveclaw.xyz/health"
          - "https://api.liveclaw.xyz/readyz"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"
    scrape_interval: 30s
