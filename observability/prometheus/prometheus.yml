# ═══════════════════════════════════════════════════════════════════════════
# Prometheus — LiveClaw Metrics Collection
#
# Scrapes:
#   1. Bifrost /metrics          — LLM request metrics (tokens, cost, latency)
#   2. OTel Collector /metrics   — Collector-derived metrics from OTLP pipeline
#   3. OTel Collector internal   — Collector health metrics
# ═══════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Bifrost native Prometheus metrics
  # Exposes: request counts, token usage, cost, latency histograms,
  #          cache hits, stream TTFT, inter-token latency
  - job_name: "bifrost"
    static_configs:
      - targets: ["bifrost:8080"]
        labels:
          service: "liveclaw-bifrost"
          component: "ai-gateway"
    metrics_path: /metrics
    scrape_interval: 10s

  # OTel Collector — OTLP-derived metrics (from Bifrost traces)
  - job_name: "otel-collector-bifrost"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "liveclaw-otel"
          component: "collector-pipeline"

  # OTel Collector internal health metrics
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: "collector-health"
