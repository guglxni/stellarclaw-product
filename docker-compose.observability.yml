# ═══════════════════════════════════════════════════════════════════════════
# LiveClaw — Observability Stack (Non-Critical)
#
# Connects to the liveclaw-obs network created by docker-compose.bifrost.yml.
# Bifrost MUST be started first — this stack depends on its network.
#
# Architecture:
#   Bifrost (docker-compose.bifrost.yml, port 8080)
#     ├── /metrics ────────────────→ Prometheus (port 9090)
#     └── OTLP (traces + metrics) → OTel Collector (port 4318)
#                                      ├── traces → Grafana Tempo (port 3200)
#                                      └── metrics → Prometheus
#
#   Grafana (port 3001) ← queries Tempo + Prometheus
#
# Usage:
#   docker compose -f docker-compose.bifrost.yml up -d      # start Bifrost first
#   docker compose -f docker-compose.observability.yml up -d # then observability
#   Grafana: http://localhost:3001 (admin / $GF_ADMIN_PASSWORD)
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── Blackbox Exporter (HTTP endpoint probes) ─────────────────────────────
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: liveclaw-blackbox
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"   # Blackbox UI + probe endpoint (internal)
    networks:
      - liveclaw-obs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9115/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Alertmanager (alert routing + email delivery) ────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: liveclaw-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
      - "--cluster.listen-address="          # disable HA clustering (single node)
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"   # Alertmanager UI (internal)
    networks:
      - liveclaw-obs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    container_name: liveclaw-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (internal)
      - "127.0.0.1:4318:4318"   # OTLP HTTP (internal)
    networks:
      - liveclaw-obs
    depends_on:
      tempo:
        condition: service_started
    # otel-collector-contrib uses a distroless base image (no wget/curl/sh).
    # Health check disabled — container startup/crash handling via restart: unless-stopped.
    healthcheck:
      test: ["NONE"]

  # ── Grafana Tempo (Trace Storage) ────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: liveclaw-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo query API (internal)
    networks:
      - liveclaw-obs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Prometheus (Metrics) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: liveclaw-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-remote-write-receiver"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # Prometheus UI (internal)
    networks:
      - liveclaw-obs
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Grafana (Dashboards & Visualization) ─────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: liveclaw-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme-generate-a-real-password}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_DATABASE_WAL=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      # SMTP — enables Grafana's own alert emails (same Gmail App Password as Alertmanager)
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=guglaniaaryan@gmail.com
      - GF_SMTP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=guglaniaaryan@gmail.com
      - GF_SMTP_FROM_NAME=LiveClaw Monitoring
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3001"   # Grafana UI
    networks:
      - liveclaw-obs
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy

networks:
  liveclaw-obs:
    name: liveclaw-obs
    external: true

volumes:
  tempo-data:
    name: liveclaw-tempo-data
  prometheus-data:
    name: liveclaw-prometheus-data
  grafana-data:
    name: liveclaw-grafana-data
  alertmanager-data:
    name: liveclaw-alertmanager-data
